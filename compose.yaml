services:
  postgres:
    image: postgis/postgis:16-master
    container_name: PetRadarDB
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_pet_radar:/var/lib/postgresql

volumes:
  postgres_pet_radar:
